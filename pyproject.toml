[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "qubit-state-algebra"
version = "0.1.7"
description = "Qubit State Algebra: a native adaptive qubit-state engine for Qubit and QELM"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "R&D BioTech Alaska" }
]
keywords = ["quantum", "qubit", "qelm", "simulation", "state-engine"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.urls]
Repository = "https://github.com/R-D-BioTech-Alaska/QSA"
Documentation = "https://github.com/R-D-BioTech-Alaska/QSA/tree/main/docs"
Issues = "https://github.com/R-D-BioTech-Alaska/QSA/issues"
Changelog = "https://github.com/R-D-BioTech-Alaska/QSA/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.13140/RG.2.2.19653.20965"
Commercial-Licensing = "https://github.com/R-D-BioTech-Alaska/QSA/blob/main/COMMERCIAL_LICENSE.md"

[project.optional-dependencies]
validation = ["numpy>=1.24"]

[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
wheel.packages = ["python/qsa", "python/qubit_native"]
wheel.install-dir = ""
sdist.include = [
  "CMakeLists.txt",
  "cmake/**",
  "include/**",
  "src/**",
  "python/qsa/**",
  "python/qubit_native/**",
  "tests/**",
  "benchmarks/**",
  "examples/**",
  "docs/**",
  "compatibility/**",
  "tools/**",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CITATION.cff",
  "COMMERCIAL_LICENSE.md",
  "LICENSE_HISTORY.md",
  "TRADEMARKS.md",
  "NOTICE",
  "LICENSE",
  "VERSION"
]

[tool.scikit-build.cmake.define]
QSTATE_BUILD_TESTS = "OFF"
QSTATE_BUILD_EXAMPLES = "OFF"
QSTATE_BUILD_BENCHMARKS = "OFF"
QSTATE_BUILD_PYTHON_TESTS = "OFF"
QSTATE_INSTALL_DEVELOPMENT = "OFF"
