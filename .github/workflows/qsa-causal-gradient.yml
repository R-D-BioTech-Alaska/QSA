name: QSA Causal Gradient Runtime

on:
  pull_request:
    paths:
      - "python/qsa/causal_grad.py"
      - "tests/test_causal_grad_python.py"
      - "benchmarks/causal_gradient_python.py"
      - ".github/workflows/qsa-causal-gradient.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsa-causal-gradient-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradient-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QSA
        run: python -m pip install --upgrade pip .
      - name: Test causal gradients
        run: python tests/test_causal_grad_python.py

  gradient-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QSA
        run: python -m pip install --upgrade pip .
      - name: Benchmark causal gradients
        run: python benchmarks/causal_gradient_python.py | tee causal-gradient.txt
      - name: Seal benchmark receipt
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          line = Path("causal-gradient.txt").read_text(encoding="utf-8").strip()
          fields = line.split()
          if not fields or fields[0] != "causal_gradient":
              raise SystemExit("unexpected causal gradient output")
          receipt = {"schema_version": "qsa.causal-gradient-benchmark.v1"}
          integer_fields = {"parameters", "observables", "evaluations", "operations"}
          for field in fields[1:]:
              key, value = field.split("=", 1)
              receipt[key] = int(value) if key in integer_fields else float(value)
          receipt["passed"] = (
              receipt["parameters"] == 18
              and receipt["observables"] == 14
              and receipt["evaluations"] == 37
              and receipt["operations"] == 25
              and receipt["max_error"] <= 1.0e-12
              and all(
                  math.isfinite(receipt[name]) and receipt[name] > 0.0
                  for name in (
                      "qsc_ms",
                      "scalar_causal_ms",
                      "batch_causal_ms",
                      "batch_vs_qsc",
                      "batch_vs_scalar",
                  )
              )
          )
          if not receipt["passed"]:
              raise SystemExit(f"causal gradient gate failed: {receipt}")
          Path("causal-gradient.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-causal-gradient-${{ github.run_id }}
          path: |
            causal-gradient.txt
            causal-gradient.json
          if-no-files-found: error
