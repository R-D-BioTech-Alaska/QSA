name: QSA Causal Pauli Support

on:
  pull_request:
    paths:
      - "include/qubit/qcausal_c_api.h"
      - "include/qubit/detail/qcausal_pauli_support_impl.hpp"
      - "include/qubit/version.h"
      - "python/qsa/causal_support.py"
      - "tests/test_causal_support_python.py"
      - "benchmarks/causal_support_python.py"
      - ".github/workflows/qsa-causal-support.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsa-causal-support-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  causal-support-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QSA
        run: python -m pip install --upgrade pip .
      - name: Test compact Pauli support
        run: python tests/test_causal_support_python.py

  causal-support-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QSA
        run: python -m pip install --upgrade pip .
      - name: Benchmark compact Pauli support
        run: python benchmarks/causal_support_python.py | tee causal-support.txt
      - name: Seal benchmark receipt
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          line = Path("causal-support.txt").read_text(encoding="utf-8").strip()
          fields = line.split()
          if not fields or fields[0] != "causal_support":
              raise SystemExit("unexpected causal support benchmark output")
          receipt = {"schema_version": "qsa.causal-support-benchmark.v1"}
          integer_fields = {
              "qubits",
              "branches",
              "observables",
              "support_terms",
              "full_word_bytes",
          }
          for field in fields[1:]:
              key, value = field.split("=", 1)
              receipt[key] = int(value) if key in integer_fields else float(value)
          receipt["passed"] = (
              receipt["qubits"] == 10_000
              and receipt["branches"] == 128
              and receipt["observables"] == 14
              and receipt["support_terms"] == 21
              and receipt["full_word_bytes"] == 140_000
              and receipt["max_error"] <= 2.0e-12
              and all(
                  math.isfinite(receipt[name]) and receipt[name] > 0.0
                  for name in ("full_batch_ms", "support_batch_ms", "speedup")
              )
          )
          if not receipt["passed"]:
              raise SystemExit(f"causal support gate failed: {receipt}")
          Path("causal-support.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-causal-support-${{ github.run_id }}
          path: |
            causal-support.txt
            causal-support.json
          if-no-files-found: error
