name: QSA Parameterized Estimator Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsa-parameterized-estimator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parameterized-estimator-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matched benchmark dependencies
        run: >-
          python -m pip install --upgrade pip
          qiskit==2.5.1 qiskit-aer==0.17.2
      - name: Configure exact runtime
        run: >-
          cmake -S . -B build-parameterized-estimator -DCMAKE_BUILD_TYPE=Release
          -DQSTATE_BUILD_TESTS=OFF
          -DQSTATE_BUILD_EXAMPLES=OFF
          -DQSTATE_BUILD_BENCHMARKS=OFF
          -DQSTATE_BUILD_PYTHON_TESTS=OFF
          -DQSTATE_NATIVE_ARCH=ON
      - name: Build exact runtime
        run: >-
          cmake --build build-parameterized-estimator --config Release --parallel
          --target qstate_core
      - name: Build parameterized estimator evidence
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Iinclude tests/test_parameterized_estimator.cpp build-parameterized-estimator/libqstate_core.a -pthread -o build-parameterized-estimator/qstate_parameterized_estimator_test
          c++ -std=c++20 -O3 -march=native -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Iinclude benchmarks/parameterized_estimator.cpp build-parameterized-estimator/libqstate_core.a -pthread -o build-parameterized-estimator/qstate_parameterized_estimator_benchmark
      - name: Test exact parameterized estimator
        run: ./build-parameterized-estimator/qstate_parameterized_estimator_test
      - name: Run QSA parameter sweep benchmark
        run: |
          set -o pipefail
          ./build-parameterized-estimator/qstate_parameterized_estimator_benchmark | tee parameterized-estimator.txt
      - name: Run matched Qiskit Aer parameter sweep
        env:
          OMP_NUM_THREADS: "4"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -o pipefail
          python benchmarks/parameterized_estimator_aer.py --qsa-output parameterized-estimator.txt | tee parameterized-estimator-vs-aer.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-parameterized-estimator-evidence
          path: |
            parameterized-estimator.txt
            parameterized-estimator-vs-aer.txt
