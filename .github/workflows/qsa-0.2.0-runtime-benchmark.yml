name: QSA 0.2.0 Runtime Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsa-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: >-
          python -m pip install --upgrade pip numpy sympy==1.14.0
          qiskit==2.5.1 qiskit-aer==0.17.2
      - name: Configure release benchmarks
        run: >-
          cmake -S . -B build-runtime -DCMAKE_BUILD_TYPE=Release
          -DQSTATE_BUILD_TESTS=OFF
          -DQSTATE_BUILD_EXAMPLES=ON
          -DQSTATE_BUILD_BENCHMARKS=ON
          -DQSTATE_BUILD_PYTHON_TESTS=OFF
          -DQSTATE_NATIVE_ARCH=ON
      - name: Build runtime evidence targets
        run: >-
          cmake --build build-runtime --config Release --parallel --target
          qstate_numeric_benchmark
          qstate_tensor_contraction_plan_benchmark
          qstate_tensor_expectation_benchmark
          qstate_estimator_benchmark
          qstate_parameterized_estimator_benchmark
          qstate_tensor_adjoint_causal_benchmark
          qstate_mps_benchmark
          qstate_phase_graph_benchmark
          qstate_stabilizer_benchmark
      - name: Build structural runtime checks
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Iinclude tests/test_kron_operator.cpp -o build-runtime/qstate_kron_operator_test
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Iinclude tests/test_tensor_rebind.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_tensor_rebind_test
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Iinclude tests/test_tensor_adjoint.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_tensor_adjoint_test
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Iinclude tests/test_tensor_adjoint_runtime_width.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_tensor_adjoint_runtime_width_test
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Iinclude tests/test_tensor_adjoint_batch.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_tensor_adjoint_batch_test
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Iinclude tests/test_tensor_adjoint_scheduler.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_tensor_adjoint_scheduler_test
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Iinclude tests/test_tensor_adjoint_causal.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_tensor_adjoint_causal_test
          c++ -std=c++20 -O3 -march=native -Wall -Wextra -Wpedantic -Iinclude benchmarks/marginal_probability.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_marginal_probability_benchmark
          c++ -std=c++20 -O3 -march=native -Wall -Wextra -Wpedantic -Iinclude benchmarks/tensor_planner_scaling.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_tensor_planner_scaling_benchmark
          c++ -std=c++20 -O3 -march=native -Wall -Wextra -Wpedantic -Iinclude benchmarks/tensor_rebind.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_tensor_rebind_benchmark
          c++ -std=c++20 -O3 -march=native -Wall -Wextra -Wpedantic -Iinclude benchmarks/tensor_adjoint.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_tensor_adjoint_benchmark
          c++ -std=c++20 -O3 -march=native -Wall -Wextra -Wpedantic -Iinclude benchmarks/tensor_adjoint_batch.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_tensor_adjoint_batch_benchmark
          c++ -std=c++20 -O3 -march=native -Wall -Wextra -Wpedantic -Iinclude benchmarks/tensor_adjoint_scheduler.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_tensor_adjoint_scheduler_benchmark
          c++ -std=c++20 -O3 -march=native -Wall -Wextra -Wpedantic -Iinclude benchmarks/tensor_adjoint_aer.cpp build-runtime/libqstate_core.a -pthread -o build-runtime/qstate_tensor_adjoint_aer_benchmark
          c++ -std=c++20 -O3 -march=native -Wall -Wextra -Wpedantic -Iinclude benchmarks/qmath_exact_platform.cpp -o build-runtime/qstate_qmath_exact_platform_benchmark
      - name: Test structured runtime additions
        run: |
          ./build-runtime/qstate_kron_operator_test
          ./build-runtime/qstate_tensor_rebind_test
          ./build-runtime/qstate_tensor_adjoint_test
          ./build-runtime/qstate_tensor_adjoint_runtime_width_test
          ./build-runtime/qstate_tensor_adjoint_batch_test
          ./build-runtime/qstate_tensor_adjoint_scheduler_test
          ./build-runtime/qstate_tensor_adjoint_causal_test
      - name: Run native numeric benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_numeric_benchmark | tee qsa-numeric.txt
      - name: Run matched NumPy benchmark
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -o pipefail
          python benchmarks/numeric_numpy.py --qsa-output qsa-numeric.txt | tee qsa-vs-numpy.txt
      - name: Run exact rational platform benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_qmath_exact_platform_benchmark | tee qmath-exact-platform.json
      - name: Run matched SymPy exact rational benchmark
        run: |
          set -o pipefail
          python benchmarks/qmath_sympy_control.py --qsa qmath-exact-platform.json --output qmath-vs-sympy.json | tee qmath-vs-sympy.txt
      - name: Run persistent MPS benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_mps_benchmark | tee mps.txt
      - name: Run phase-graph benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_phase_graph_benchmark | tee phase-graph.txt
      - name: Run stabilizer benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_stabilizer_benchmark | tee stabilizer.txt
      - name: Run marginal probability benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_marginal_probability_benchmark | tee marginal-probability.txt
      - name: Run compiled tensor benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_tensor_contraction_plan_benchmark | tee tensor-plan.txt
      - name: Run tensor planner scaling benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_tensor_planner_scaling_benchmark | tee tensor-planner-scaling.txt
      - name: Run tensor expectation benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_tensor_expectation_benchmark | tee tensor-expectation.txt
      - name: Run tensor rebind benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_tensor_rebind_benchmark | tee tensor-rebind.txt
      - name: Run tensor adjoint benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_tensor_adjoint_benchmark | tee tensor-adjoint.txt
      - name: Run tensor adjoint point-batch benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_tensor_adjoint_batch_benchmark | tee tensor-adjoint-batch.txt
      - name: Run tensor adjoint scheduler benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_tensor_adjoint_scheduler_benchmark | tee tensor-adjoint-scheduler.txt
      - name: Run tensor adjoint causal benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_tensor_adjoint_causal_benchmark | tee tensor-adjoint-causal.txt
      - name: Run QSA exact gradient baseline
        run: |
          set -o pipefail
          ./build-runtime/qstate_tensor_adjoint_aer_benchmark | tee tensor-adjoint-aer.txt
      - name: Run matched Qiskit Aer exact gradient benchmark
        env:
          OMP_NUM_THREADS: "4"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -o pipefail
          python benchmarks/gradient_aer.py --qsa-output tensor-adjoint-aer.txt | tee qsa-gradient-vs-aer.txt
      - name: Run exact estimator benchmark
        run: |
          set -o pipefail
          ./build-runtime/qstate_estimator_benchmark | tee estimator.txt
      - name: Run matched Qiskit Aer benchmark
        env:
          OMP_NUM_THREADS: "4"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -o pipefail
          python benchmarks/estimator_aer.py --qsa-output estimator.txt | tee qsa-vs-aer.txt
      - name: Run exact parameterized estimator sweep
        run: |
          set -o pipefail
          ./build-runtime/qstate_parameterized_estimator_benchmark | tee parameterized-estimator.txt
      - name: Run matched Qiskit Aer parameter sweep
        env:
          OMP_NUM_THREADS: "4"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -o pipefail
          python benchmarks/parameterized_estimator_aer.py --qsa-output parameterized-estimator.txt | tee parameterized-estimator-vs-aer.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-0.2.0-runtime-evidence
          path: |
            qsa-numeric.txt
            qsa-vs-numpy.txt
            qmath-exact-platform.json
            qmath-vs-sympy.json
            qmath-vs-sympy.txt
            mps.txt
            phase-graph.txt
            stabilizer.txt
            marginal-probability.txt
            tensor-plan.txt
            tensor-planner-scaling.txt
            tensor-expectation.txt
            tensor-rebind.txt
            tensor-adjoint.txt
            tensor-adjoint-batch.txt
            tensor-adjoint-scheduler.txt
            tensor-adjoint-causal.txt
            tensor-adjoint-aer.txt
            qsa-gradient-vs-aer.txt
            estimator.txt
            qsa-vs-aer.txt
            parameterized-estimator.txt
            parameterized-estimator-vs-aer.txt
