name: QSA 0.2.0 Runtime Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsa-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark dependency
        run: python -m pip install --upgrade pip numpy
      - name: Configure release benchmarks
        run: >-
          cmake -S . -B build-runtime -DCMAKE_BUILD_TYPE=Release
          -DQSTATE_BUILD_TESTS=OFF
          -DQSTATE_BUILD_EXAMPLES=ON
          -DQSTATE_BUILD_BENCHMARKS=ON
          -DQSTATE_BUILD_PYTHON_TESTS=OFF
          -DQSTATE_NATIVE_ARCH=ON
      - name: Build runtime evidence targets
        run: >-
          cmake --build build-runtime --config Release --parallel --target
          qstate_numeric_benchmark
          qstate_tensor_contraction_plan_benchmark
          qstate_tensor_expectation_benchmark
          qstate_estimator_benchmark
      - name: Run native numeric benchmark
        run: ./build-runtime/qstate_numeric_benchmark | tee qsa-numeric.txt
      - name: Run matched NumPy benchmark
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python benchmarks/numeric_numpy.py --qsa-output qsa-numeric.txt | tee qsa-vs-numpy.txt
      - name: Run compiled tensor benchmark
        run: ./build-runtime/qstate_tensor_contraction_plan_benchmark | tee tensor-plan.txt
      - name: Run tensor expectation benchmark
        run: ./build-runtime/qstate_tensor_expectation_benchmark | tee tensor-expectation.txt
      - name: Run exact estimator benchmark
        run: ./build-runtime/qstate_estimator_benchmark | tee estimator.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-0.2.0-runtime-evidence
          path: |
            qsa-numeric.txt
            qsa-vs-numpy.txt
            tensor-plan.txt
            tensor-expectation.txt
            estimator.txt
