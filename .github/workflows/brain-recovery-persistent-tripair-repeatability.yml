name: Brain Recovery Persistent Tripair Repeatability

on:
  pull_request:
    paths:
      - "benchmarks/brain_recovery_tripair_optimizer_step.py"
      - "benchmarks/brain_recovery_tripair_optimizer_step_v2.py"
      - "benchmarks/brain_recovery_tripair_optimizer_step_v3.py"
      - "benchmarks/brain_recovery_persistent_tripair_repeatability.py"
      - "python/qsa/causal_persistent_workspace.py"
      - "python/qsa/causal_adjoint.py"
      - "include/qubit/qadjoint.hpp"
      - ".github/workflows/brain-recovery-persistent-tripair-repeatability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-recovery-persistent-tripair-repeatability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-repeatability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - name: Check out exact branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact QSA and pinned CPU controls
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .

      - name: Compile repeatability diagnostic
        run: |
          python -m py_compile \
            benchmarks/brain_recovery_tripair_optimizer_step.py \
            benchmarks/brain_recovery_tripair_optimizer_step_v2.py \
            benchmarks/brain_recovery_tripair_optimizer_step_v3.py \
            benchmarks/brain_recovery_persistent_tripair_repeatability.py

      - name: Re-run inherited exact and persistent contracts
        run: |
          python tests/test_causal_adjoint_python.py
          python tests/test_persistent_adjoint_python.py

      - name: Compare cached, fresh, and primed pullback sequences
        shell: bash
        run: |
          set +e
          set -o pipefail
          python benchmarks/brain_recovery_persistent_tripair_repeatability.py \
            --repeats 6 \
            --output brain-recovery-persistent-tripair-repeatability.json \
            2>&1 | tee brain-recovery-persistent-tripair-repeatability.txt
          diagnostic_exit=${PIPESTATUS[0]}
          echo "BRAIN_RECOVERY_REPEATABILITY_EXIT=$diagnostic_exit" >> "$GITHUB_ENV"
          exit 0

      - name: Summarize repeatability evidence
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("brain-recovery-persistent-tripair-repeatability.json")
          if not path.is_file():
              raise SystemExit("repeatability diagnostic did not emit a JSON receipt")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          print("contract=", receipt["contract"])
          for name in (
              "cached_selected_pullback",
              "cached_direct_adjoint",
              "fresh_runtime_per_pullback",
              "zero_cotangent_primed_selected_pullback",
          ):
              print(name, receipt[name])
          print("passed=", receipt["passed"])
          raise SystemExit(0 if receipt["passed"] else 1)
          PY
          summary_exit=$?
          echo "BRAIN_RECOVERY_REPEATABILITY_SUMMARY_EXIT=$summary_exit" >> "$GITHUB_ENV"
          exit 0

      - name: Upload repeatability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-recovery-persistent-tripair-repeatability-${{ github.run_id }}
          path: |
            brain-recovery-persistent-tripair-repeatability.json
            brain-recovery-persistent-tripair-repeatability.txt
          if-no-files-found: error
          retention-days: 90

      - name: Enforce repeatability diagnostic completeness
        if: always()
        shell: bash
        run: |
          if [ "${BRAIN_RECOVERY_REPEATABILITY_EXIT:-1}" -ne 0 ]; then
            echo "The repeatability diagnostic did not complete."
            exit 1
          fi
          if [ "${BRAIN_RECOVERY_REPEATABILITY_SUMMARY_EXIT:-1}" -ne 0 ]; then
            echo "The repeatability receipt was missing, malformed, or incomplete."
            exit 1
          fi
