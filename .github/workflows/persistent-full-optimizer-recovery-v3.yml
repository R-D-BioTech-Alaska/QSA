name: Persistent Full Optimizer Recovery v3

on:
  pull_request:
    paths:
      - "benchmarks/persistent_pullback_lifecycle_regression_v2.py"
      - "docs/PERSISTENT_PULLBACK_RECOVERY_V2.md"
      - ".github/workflows/persistent-full-optimizer-recovery-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistent-full-optimizer-recovery-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONFAULTHANDLER: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  persistent-full-optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out current persistent baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out frozen PR 35 recovery harness
        uses: actions/checkout@v4
        with:
          ref: 454c6d2b03502c0dd3a602885f3fb8f06a268a98
          path: recovery-evidence
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current QSA and matched CPU controls
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 psutil==7.0.0
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .

      - name: Run current lifecycle regression
        shell: bash
        run: |
          set -o pipefail
          python benchmarks/persistent_pullback_lifecycle_regression_v2.py \
            --output persistent-pullback-lifecycle-regression-v2.json \
            2>&1 | tee persistent-pullback-lifecycle-regression-v2.txt

      - name: Run original 5,395-parameter 1/5/20 matrix
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery-evidence/benchmarks
        run: |
          set -o pipefail
          python recovery-evidence/benchmarks/brain_recovery_tripair_optimizer_step_v3.py \
            --steps 20 \
            --output persistent-tripair-optimizer-current-v3.json \
            2>&1 | tee persistent-tripair-optimizer-current-v3.txt

      - name: Verify current receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lifecycle = json.loads(
              Path("persistent-pullback-lifecycle-regression-v2.json").read_text(
                  encoding="utf-8"
              )
          )
          optimizer = json.loads(
              Path("persistent-tripair-optimizer-current-v3.json").read_text(
                  encoding="utf-8"
              )
          )
          if not lifecycle.get("passed"):
              raise SystemExit(f"lifecycle regression failed: {lifecycle}")
          if not optimizer.get("passed"):
              raise SystemExit(f"persistent optimizer failed: {optimizer}")
          cases = optimizer.get("result_window", {}).get("cases", [])
          observed = sorted(
              (int(case["batch_size"]), int(case["steps"])) for case in cases
          )
          expected = sorted(
              (batch, steps)
              for batch in (1, 4, 16, 64)
              for steps in (1, 5, 20)
          )
          if observed != expected:
              raise SystemExit(
                  f"persistent optimizer matrix mismatch: {observed} != {expected}"
              )
          print(json.dumps({
              "lifecycle_passed": lifecycle["passed"],
              "optimizer_passed": optimizer["passed"],
              "matrix": observed,
              "diagnosis": optimizer.get("diagnosis"),
              "not_established": optimizer.get("not_established"),
          }, sort_keys=True))
          PY

      - name: Seal current persistent evidence
        run: |
          sha256sum persistent-pullback-lifecycle-regression-v2.json \
            > persistent-pullback-lifecycle-regression-v2.sha256
          sha256sum persistent-tripair-optimizer-current-v3.json \
            > persistent-tripair-optimizer-current-v3.sha256
          sha256sum \
            benchmarks/persistent_pullback_lifecycle_regression_v2.py \
            recovery-evidence/benchmarks/brain_recovery_tripair_optimizer_step.py \
            recovery-evidence/benchmarks/brain_recovery_tripair_optimizer_step_v2.py \
            recovery-evidence/benchmarks/brain_recovery_tripair_optimizer_step_v3.py \
            .github/workflows/persistent-full-optimizer-recovery-v3.yml \
            > persistent-full-optimizer-recovery-v3-sources.sha256

      - name: Upload current persistent evidence
        uses: actions/upload-artifact@v4
        with:
          name: persistent-full-optimizer-recovery-v3-${{ github.run_id }}
          path: |
            persistent-pullback-lifecycle-regression-v2.json
            persistent-pullback-lifecycle-regression-v2.txt
            persistent-pullback-lifecycle-regression-v2.sha256
            persistent-tripair-optimizer-current-v3.json
            persistent-tripair-optimizer-current-v3.txt
            persistent-tripair-optimizer-current-v3.sha256
            persistent-full-optimizer-recovery-v3-sources.sha256
          if-no-files-found: error
          retention-days: 90
