name: Persistent Full Optimizer Recovery v3

on:
  pull_request:
    paths:
      - "benchmarks/persistent_pullback_lifecycle_regression_v2.py"
      - "docs/PERSISTENT_PULLBACK_RECOVERY_V2.md"
      - ".github/workflows/persistent-full-optimizer-recovery-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistent-full-optimizer-recovery-v3-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONFAULTHANDLER: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  persistent-full-optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out current persistent baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out frozen PR 35 recovery harness
        uses: actions/checkout@v4
        with:
          ref: 454c6d2b03502c0dd3a602885f3fb8f06a268a98
          path: recovery-evidence
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current QSA and matched CPU controls
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 psutil==7.0.0
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .

      - name: Run current lifecycle regression
        shell: bash
        run: |
          set -o pipefail
          python benchmarks/persistent_pullback_lifecycle_regression_v2.py \
            --output persistent-pullback-lifecycle-regression-v2.json \
            2>&1 | tee persistent-pullback-lifecycle-regression-v2.txt

      - name: Run original 5,395-parameter 1/5/20 matrix
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery-evidence/benchmarks
        run: |
          set -o pipefail
          for steps in 1 5 20; do
            STEPS="${steps}" OUTPUT="persistent-tripair-optimizer-steps-${steps}.json" \
              python - <<'PY' 2>&1 | tee "persistent-tripair-optimizer-steps-${steps}.txt"
          import json
          import os
          from pathlib import Path
          import brain_recovery_tripair_optimizer_step_v3 as v3

          steps = int(os.environ["STEPS"])
          v3.v1.torch.set_num_threads(1)
          v3.v1.torch.set_num_interop_threads(1)
          receipt = v3.build_receipt(steps)
          Path(os.environ["OUTPUT"]).write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          if not receipt.get("passed"):
              raise SystemExit(
                  f"persistent optimizer matrix failed for {steps} steps"
              )
          PY
          done

      - name: Verify and combine current receipts
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          lifecycle_path = Path("persistent-pullback-lifecycle-regression-v2.json")
          lifecycle = json.loads(lifecycle_path.read_text(encoding="utf-8"))
          if not lifecycle.get("passed"):
              raise SystemExit(f"lifecycle regression failed: {lifecycle}")

          expected = sorted(
              (batch, steps)
              for batch in (1, 4, 16, 64)
              for steps in (1, 5, 20)
          )
          observed = []
          optimizer_receipts = []
          for steps in (1, 5, 20):
              path = Path(f"persistent-tripair-optimizer-steps-{steps}.json")
              receipt = json.loads(path.read_text(encoding="utf-8"))
              if not receipt.get("passed"):
                  raise SystemExit(
                      f"persistent optimizer failed for {steps} steps: {receipt}"
                  )
              cases = receipt.get("cases", [])
              if len(cases) != 4:
                  raise SystemExit(
                      f"expected four batch cases for {steps} steps, got {len(cases)}"
                  )
              for case in cases:
                  key = (int(case["batch_size"]), int(case["steps"]))
                  observed.append(key)
                  if key[1] != steps:
                      raise SystemExit(f"step-count mismatch in {path}: {key}")
                  if not case.get("passed"):
                      raise SystemExit(f"failed persistent case {key}: {case}")
                  qsa = case.get("candidate", {}).get("qsa", {})
                  rollback = case.get("rollback", {})
                  if int(qsa.get("workspace_extractions", -1)) != 1:
                      raise SystemExit(f"workspace extraction mismatch in {key}: {qsa}")
                  if not qsa.get("root_immutable") or not qsa.get("workspace_immutable"):
                      raise SystemExit(f"persistent state mutated in {key}: {qsa}")
                  if int(qsa.get("shifted_evaluations", -1)) != 0:
                      raise SystemExit(f"shifted evaluations occurred in {key}: {qsa}")
                  if not rollback.get("baseline_optimizer_exact"):
                      raise SystemExit(f"baseline rollback failed in {key}: {rollback}")
                  if not rollback.get("candidate_optimizer_exact"):
                      raise SystemExit(f"candidate rollback failed in {key}: {rollback}")
                  if float(rollback.get("baseline_model_max_error", 1.0)) != 0.0:
                      raise SystemExit(f"baseline model rollback failed in {key}: {rollback}")
                  if float(rollback.get("candidate_model_max_error", 1.0)) != 0.0:
                      raise SystemExit(f"candidate model rollback failed in {key}: {rollback}")
              optimizer_receipts.append({
                  "path": str(path),
                  "sha256": sha256(path),
                  "schema_version": receipt.get("schema_version"),
                  "passed": receipt.get("passed"),
                  "candidate_faster_batch_sizes": receipt.get(
                      "candidate_faster_batch_sizes"
                  ),
                  "cases": cases,
                  "not_established": receipt.get("not_established"),
              })

          observed = sorted(observed)
          if observed != expected:
              raise SystemExit(
                  f"persistent optimizer matrix mismatch: {observed} != {expected}"
              )

          source = {
              "checkout_head": subprocess.run(
                  ("git", "rev-parse", "HEAD"),
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip(),
              "branch_head": subprocess.run(
                  (
                      "git", "rev-parse",
                      "origin/agent/qsa-persistent-pullback-lifecycle-recovery-v2",
                  ),
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip(),
              "base_exactness_repair": (
                  "748e4a40483de72ea5e9092d1db45a62ec6b4a16"
              ),
              "frozen_harness_head": subprocess.run(
                  ("git", "-C", "recovery-evidence", "rev-parse", "HEAD"),
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.strip(),
          }
          combined = {
              "schema_version": "qsa.persistent-full-optimizer-recovery.v3",
              "source": source,
              "contract": {
                  "batches": [1, 4, 16, 64],
                  "step_counts": [1, 5, 20],
                  "active_trainable_parameters": 5395,
                  "runtime_files_changed": False,
                  "gpu_used": False,
              },
              "lifecycle": {
                  "path": str(lifecycle_path),
                  "sha256": sha256(lifecycle_path),
                  "schema_version": lifecycle.get("schema_version"),
                  "passed": lifecycle.get("passed"),
                  "generation_0": lifecycle["lifecycle"]["generation_0"],
                  "new_batch_same_generation": lifecycle["lifecycle"][
                      "new_batch_same_generation"
                  ],
                  "generation_1": lifecycle["lifecycle"]["generation_1"],
                  "after_refresh": lifecycle["lifecycle"]["after_refresh"],
                  "decoded_rollback": lifecycle["lifecycle"][
                      "decoded_rollback"
                  ],
                  "discard_rejected": lifecycle["lifecycle"][
                      "discard_rejected"
                  ],
                  "rollback_root_exact": lifecycle["lifecycle"][
                      "rollback_root_exact"
                  ],
              },
              "optimizer_receipts": optimizer_receipts,
              "observed_matrix": observed,
              "expected_matrix": expected,
              "passed": True,
              "classification_candidate": (
                  "PERSISTENT_RECOVERED_PENDING_INDEPENDENT_ARTIFACT_VERIFICATION"
              ),
              "selected_integration_route": "V10",
              "claim_boundary": [
                  "Persistent correctness does not displace V10.",
                  "No persistent complete-system advantage is claimed.",
                  "No Brain language, canonical, safety, production, uniqueness, or physical-QPU claim is established.",
              ],
          }
          output = Path("persistent-full-optimizer-recovery-v3.json")
          output.write_text(
              json.dumps(combined, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "passed": combined["passed"],
              "matrix": observed,
              "source": source,
              "classification_candidate": combined[
                  "classification_candidate"
              ],
          }, sort_keys=True))
          PY

      - name: Seal current persistent evidence
        run: |
          sha256sum persistent-pullback-lifecycle-regression-v2.json \
            > persistent-pullback-lifecycle-regression-v2.sha256
          for steps in 1 5 20; do
            sha256sum "persistent-tripair-optimizer-steps-${steps}.json" \
              > "persistent-tripair-optimizer-steps-${steps}.sha256"
          done
          sha256sum persistent-full-optimizer-recovery-v3.json \
            > persistent-full-optimizer-recovery-v3.sha256
          sha256sum \
            benchmarks/persistent_pullback_lifecycle_regression_v2.py \
            recovery-evidence/benchmarks/brain_recovery_tripair_optimizer_step.py \
            recovery-evidence/benchmarks/brain_recovery_tripair_optimizer_step_v2.py \
            recovery-evidence/benchmarks/brain_recovery_tripair_optimizer_step_v3.py \
            .github/workflows/persistent-full-optimizer-recovery-v3.yml \
            > persistent-full-optimizer-recovery-v3-sources.sha256

      - name: Upload current persistent evidence
        uses: actions/upload-artifact@v4
        with:
          name: persistent-full-optimizer-recovery-v3-${{ github.run_id }}
          path: |
            persistent-pullback-lifecycle-regression-v2.json
            persistent-pullback-lifecycle-regression-v2.txt
            persistent-pullback-lifecycle-regression-v2.sha256
            persistent-tripair-optimizer-steps-1.json
            persistent-tripair-optimizer-steps-1.txt
            persistent-tripair-optimizer-steps-1.sha256
            persistent-tripair-optimizer-steps-5.json
            persistent-tripair-optimizer-steps-5.txt
            persistent-tripair-optimizer-steps-5.sha256
            persistent-tripair-optimizer-steps-20.json
            persistent-tripair-optimizer-steps-20.txt
            persistent-tripair-optimizer-steps-20.sha256
            persistent-full-optimizer-recovery-v3.json
            persistent-full-optimizer-recovery-v3.sha256
            persistent-full-optimizer-recovery-v3-sources.sha256
          if-no-files-found: error
          retention-days: 90
