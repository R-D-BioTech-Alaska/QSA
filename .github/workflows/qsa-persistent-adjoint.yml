name: QSA Persistent Weighted Adjoint

on:
  pull_request:
    paths:
      - "python/qsa/causal_persistent_workspace.py"
      - "tests/test_persistent_adjoint_python.py"
      - "benchmarks/persistent_adjoint_python.py"
      - "benchmarks/persistent_pullback_lifecycle_regression_v2.py"
      - ".github/workflows/qsa-persistent-adjoint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsa-persistent-adjoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONFAULTHANDLER: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  persistent-adjoint-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QSA
        run: python -m pip install --upgrade pip .
      - name: Test retained-workspace adjoints
        run: |
          python tests/test_persistent_component_workspace_python.py
          python tests/test_persistent_adjoint_python.py

  persistent-adjoint-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QSA
        run: python -m pip install --upgrade pip .
      - name: Benchmark retained-workspace adjoints
        run: python benchmarks/persistent_adjoint_python.py | tee persistent-adjoint.txt
      - name: Seal benchmark receipt
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          line = Path("persistent-adjoint.txt").read_text(encoding="utf-8").strip()
          fields = line.split()
          if not fields or fields[0] != "persistent_adjoint":
              raise SystemExit("unexpected persistent adjoint output")
          receipt = {"schema_version": "qsa.persistent-adjoint-benchmark.v1"}
          integer_fields = {
              "logical_qubits", "local_qubits", "steps", "candidates_per_step",
              "operations", "parameters", "observables", "support_terms",
              "shift_evaluations_per_step", "adjoint_forward_sweeps_per_step",
              "adjoint_reverse_sweeps_per_step", "stored_forward_states",
          }
          for field in fields[1:]:
              key, value = field.split("=", 1)
              receipt[key] = int(value) if key in integer_fields else float(value)
          receipt["passed"] = (
              receipt["logical_qubits"] == 10_000
              and receipt["local_qubits"] == 4
              and receipt["steps"] == 6
              and receipt["candidates_per_step"] == 64
              and receipt["operations"] == 25
              and receipt["parameters"] == 18
              and receipt["observables"] == 14
              and receipt["support_terms"] == 20
              and receipt["shift_evaluations_per_step"] == 36
              and receipt["adjoint_forward_sweeps_per_step"] == 1
              and receipt["adjoint_reverse_sweeps_per_step"] == 1
              and receipt["stored_forward_states"] == 0
              and receipt["max_candidate_error"] <= 2.0e-12
              and receipt["max_value_error"] <= 2.0e-12
              and receipt["max_gradient_error"] <= 2.0e-12
              and receipt["max_final_error"] <= 2.0e-12
              and all(
                  math.isfinite(receipt[name]) and receipt[name] > 0.0
                  for name in (
                      "shift_pullback_ms", "adjoint_pullback_ms", "pullback_speedup",
                      "shift_complete_ms", "adjoint_complete_ms", "complete_speedup",
                  )
              )
              and receipt["pullback_speedup"] > 5.0
              and receipt["complete_speedup"] > 1.10
          )
          if not receipt["passed"]:
              raise SystemExit(f"persistent adjoint gate failed: {receipt}")
          Path("persistent-adjoint.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-persistent-adjoint-${{ github.run_id }}
          path: |
            persistent-adjoint.txt
            persistent-adjoint.json
          if-no-files-found: error
          retention-days: 90

  persistent-lifecycle-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact-repair QSA
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6
          python -m pip install .
      - name: Run current repeated-pullback lifecycle regression
        shell: bash
        run: |
          set -o pipefail
          python benchmarks/persistent_pullback_lifecycle_regression_v2.py \
            --output persistent-pullback-lifecycle-regression-v2.json \
            2>&1 | tee persistent-pullback-lifecycle-regression-v2.txt
      - name: Hash lifecycle evidence
        run: |
          sha256sum persistent-pullback-lifecycle-regression-v2.json \
            > persistent-pullback-lifecycle-regression-v2.sha256
          sha256sum \
            benchmarks/persistent_pullback_lifecycle_regression_v2.py \
            .github/workflows/qsa-persistent-adjoint.yml \
            > persistent-pullback-lifecycle-regression-v2-sources.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-persistent-lifecycle-regression-${{ github.run_id }}
          path: |
            persistent-pullback-lifecycle-regression-v2.json
            persistent-pullback-lifecycle-regression-v2.txt
            persistent-pullback-lifecycle-regression-v2.sha256
            persistent-pullback-lifecycle-regression-v2-sources.sha256
          if-no-files-found: error
          retention-days: 90

  persistent-full-optimizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out current persistent runtime
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out frozen recovery harness
        uses: actions/checkout@v4
        with:
          ref: 454c6d2b03502c0dd3a602885f3fb8f06a268a98
          path: recovery-evidence
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QSA and matched CPU controls
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 psutil==7.0.0
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .
      - name: Run original 5,395-parameter persistent optimizer matrix
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery-evidence/benchmarks
        run: |
          set -o pipefail
          python recovery-evidence/benchmarks/brain_recovery_tripair_optimizer_step_v3.py \
            --steps 8 \
            --output persistent-tripair-optimizer-current.json \
            2>&1 | tee persistent-tripair-optimizer-current.txt
      - name: Verify full optimizer receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("persistent-tripair-optimizer-current.json")
          if not path.is_file():
              raise SystemExit("persistent optimizer did not emit JSON")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          if not receipt.get("passed"):
              raise SystemExit(f"persistent optimizer failed: {receipt}")
          print(json.dumps({
              "schema_version": receipt.get("schema_version"),
              "passed": receipt.get("passed"),
              "result_window": receipt.get("result_window"),
              "diagnosis": receipt.get("diagnosis"),
              "not_established": receipt.get("not_established"),
          }, sort_keys=True))
          PY
      - name: Hash full optimizer evidence
        run: |
          sha256sum persistent-tripair-optimizer-current.json \
            > persistent-tripair-optimizer-current.sha256
          sha256sum \
            recovery-evidence/benchmarks/brain_recovery_tripair_optimizer_step.py \
            recovery-evidence/benchmarks/brain_recovery_tripair_optimizer_step_v2.py \
            recovery-evidence/benchmarks/brain_recovery_tripair_optimizer_step_v3.py \
            .github/workflows/qsa-persistent-adjoint.yml \
            > persistent-tripair-optimizer-current-sources.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-persistent-full-optimizer-${{ github.run_id }}
          path: |
            persistent-tripair-optimizer-current.json
            persistent-tripair-optimizer-current.txt
            persistent-tripair-optimizer-current.sha256
            persistent-tripair-optimizer-current-sources.sha256
          if-no-files-found: error
          retention-days: 90
