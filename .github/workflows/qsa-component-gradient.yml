name: QSA Component Gradient Runtime

on:
  pull_request:
    paths:
      - "python/qsa/causal_component_grad.py"
      - "tests/test_causal_component_grad_python.py"
      - "benchmarks/causal_component_gradient.py"
      - ".github/workflows/qsa-component-gradient.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsa-component-gradient-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-gradient-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QSA
        run: python -m pip install --upgrade pip .
      - name: Test component-local gradients
        run: python tests/test_causal_component_grad_python.py

  component-gradient-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QSA
        run: python -m pip install --upgrade pip .
      - name: Benchmark component-local gradients
        run: python benchmarks/causal_component_gradient.py | tee component-gradient.txt
      - name: Seal benchmark receipt
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          line = Path("component-gradient.txt").read_text(encoding="utf-8").strip()
          fields = line.split()
          if not fields or fields[0] != "causal_component_gradient":
              raise SystemExit("unexpected component gradient output")
          receipt = {"schema_version": "qsa.component-gradient-runtime.v1"}
          integer_fields = {
              "qubits",
              "local_qubits",
              "parameters",
              "observables",
              "evaluations",
              "operations",
          }
          for field in fields[1:]:
              key, value = field.split("=", 1)
              receipt[key] = int(value) if key in integer_fields else float(value)
          receipt["passed"] = (
              receipt["qubits"] == 10_000
              and receipt["local_qubits"] == 3
              and receipt["parameters"] == 18
              and receipt["observables"] == 14
              and receipt["evaluations"] == 37
              and receipt["operations"] == 25
              and receipt["max_error"] <= 2.0e-12
              and all(
                  math.isfinite(receipt[name]) and receipt[name] > 0.0
                  for name in (
                      "full_gradient_ms",
                      "component_gradient_ms",
                      "speedup",
                  )
              )
          )
          if not receipt["passed"]:
              raise SystemExit(f"component gradient gate failed: {receipt}")
          Path("component-gradient.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-component-gradient-${{ github.run_id }}
          path: |
            component-gradient.txt
            component-gradient.json
          if-no-files-found: error
