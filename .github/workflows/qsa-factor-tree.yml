name: QSA Exact Factor Tree

on:
  pull_request:
    paths:
      - "include/qubit/qfactor.hpp"
      - "include/qubit/qfactor_tree.hpp"
      - "src/qfactor.cpp"
      - "tests/test_exact_factor_tree.cpp"
      - "benchmarks/factor_tree.cpp"
      - "tests/test_architecture_layers.py"
      - ".github/workflows/qsa-factor-tree.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tree-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Create standalone tree build
        shell: bash
        run: |
          mkdir -p tree-driver
          cat > tree-driver/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(QSAFactorTreeCheck LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          enable_testing()
          add_executable(tree_tests ../tests/test_exact_factor_tree.cpp ../src/qfactor.cpp)
          target_include_directories(tree_tests PRIVATE ../include)
          if(MSVC)
              target_compile_options(tree_tests PRIVATE /W4)
          else()
              target_compile_options(tree_tests PRIVATE -Wall -Wextra -Wpedantic -Wconversion -Wshadow)
          endif()
          add_test(NAME tree_tests COMMAND tree_tests)
          EOF
      - name: Configure
        run: cmake -S tree-driver -B tree-build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build tree-build --config Release --parallel 2
      - name: Run
        run: ctest --test-dir tree-build -C Release --output-on-failure

  tree-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run ASan/UBSan
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Iinclude \
            tests/test_exact_factor_tree.cpp src/qfactor.cpp -o factor-tree-sanitize
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ./factor-tree-sanitize

  tree-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build benchmark
        run: |
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Iinclude benchmarks/factor_tree.cpp src/qfactor.cpp -o factor-tree-benchmark
      - name: Enforce architecture layers
        run: python tests/test_architecture_layers.py
      - name: Run matched controls
        run: |
          set -o pipefail
          ./factor-tree-benchmark | tee factor-tree-evidence.txt
      - name: Hash evidence
        run: sha256sum factor-tree-evidence.txt | tee factor-tree-evidence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-factor-tree-evidence
          path: |
            factor-tree-evidence.txt
            factor-tree-evidence.sha256
