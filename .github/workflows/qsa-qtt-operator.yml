name: QSA Exact QTT Operator

on:
  pull_request:
    paths:
      - "include/qubit/qqtt.hpp"
      - "include/qubit/qqtt_operator.hpp"
      - "tests/test_exact_qtt_operator.cpp"
      - "benchmarks/qtt_operator.cpp"
      - "tests/test_architecture_layers.py"
      - ".github/workflows/qsa-qtt-operator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qtt-operator-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build exact QTT operator test
        shell: bash
        run: |
          mkdir -p qtt-operator-driver
          cat > qtt-operator-driver/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(QSAQTTOperatorCheck LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          enable_testing()
          add_executable(qtt_operator_tests ../tests/test_exact_qtt_operator.cpp)
          target_include_directories(qtt_operator_tests PRIVATE ../include)
          if(MSVC)
              target_compile_options(qtt_operator_tests PRIVATE /W4)
          else()
              target_compile_options(qtt_operator_tests PRIVATE -Wall -Wextra -Wpedantic -Wconversion -Wshadow)
          endif()
          add_test(NAME qtt_operator_tests COMMAND qtt_operator_tests)
          CMAKE
      - name: Configure
        run: cmake -S qtt-operator-driver -B qtt-operator-build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build qtt-operator-build --config Release --parallel 2
      - name: Run
        run: ctest --test-dir qtt-operator-build -C Release --output-on-failure
      - name: Enforce architecture layers
        run: python tests/test_architecture_layers.py

  qtt-operator-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run ASan/UBSan
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Iinclude \
            tests/test_exact_qtt_operator.cpp -o qtt-operator-sanitize
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ./qtt-operator-sanitize

  qtt-operator-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build evidence carrier
        run: |
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Iinclude benchmarks/qtt_operator.cpp -o qtt-operator-benchmark
      - name: Run structured operator carrier
        run: |
          set -o pipefail
          ./qtt-operator-benchmark | tee qtt-operator-evidence.txt
      - name: Enforce exact bounded evidence
        run: |
          python - <<'PY'
          values = {}
          with open("qtt-operator-evidence.txt", "r", encoding="utf-8") as handle:
              for line in handle:
                  key, sep, value = line.strip().partition("=")
                  if sep:
                      values[key] = value
          def number(name):
              return float(values[name])
          assert int(values["qtt_operator_bits"]) == 4096
          assert int(values["qtt_operator_logical_domain_exponent"]) == 4096
          assert int(values["qtt_operator_rank"]) == 2
          assert int(values["qtt_operator_output_rank"]) == 4
          assert int(values["qtt_operator_descriptor_scalars"]) < 100000
          assert int(values["qtt_operator_output_descriptor_scalars"]) < 200000
          assert number("qtt_operator_selected_error") <= 1e-9
          assert number("qtt_operator_build_ms") < 10000.0
          assert number("qtt_operator_apply_ms") < 10000.0
          assert number("qtt_operator_query_ms") < 10000.0
          PY
      - name: Hash evidence
        run: sha256sum qtt-operator-evidence.txt | tee qtt-operator-evidence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-qtt-operator-evidence
          path: |
            qtt-operator-evidence.txt
            qtt-operator-evidence.sha256
