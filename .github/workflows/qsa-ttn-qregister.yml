name: QSA TTN QRegister Differential

on:
  pull_request:
    paths:
      - "include/qubit/qttn.hpp"
      - "tests/test_tree_tensor_qregister.cpp"
      - "src/qstate.cpp"
      - ".github/workflows/qsa-ttn-qregister.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qregister-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Iinclude tests/test_tree_tensor_qregister.cpp src/qstate.cpp -o tree-tensor-qregister
      - name: Run
        run: ./tree-tensor-qregister
