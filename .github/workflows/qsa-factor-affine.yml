name: QSA Exact Factor Affine

on:
  pull_request:
    paths:
      - "include/qubit/qfactor.hpp"
      - "include/qubit/qfactor_affine.hpp"
      - "include/qubit/qfactor_decision.hpp"
      - "src/qfactor.cpp"
      - "tests/test_exact_factor_affine.cpp"
      - "benchmarks/factor_affine.cpp"
      - "tests/test_architecture_layers.py"
      - ".github/workflows/qsa-factor-affine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affine-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Create standalone affine build
        shell: bash
        run: |
          mkdir -p affine-driver
          cat > affine-driver/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(QSAFactorAffineCheck LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          enable_testing()
          add_executable(affine_tests ../tests/test_exact_factor_affine.cpp ../src/qfactor.cpp)
          target_include_directories(affine_tests PRIVATE ../include)
          if(MSVC)
              target_compile_options(affine_tests PRIVATE /W4)
          else()
              target_compile_options(affine_tests PRIVATE -Wall -Wextra -Wpedantic -Wconversion -Wshadow)
          endif()
          add_test(NAME affine_tests COMMAND affine_tests)
          EOF
      - name: Configure
        run: cmake -S affine-driver -B affine-build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build affine-build --config Release --parallel 2
      - name: Run
        run: ctest --test-dir affine-build -C Release --output-on-failure

  affine-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run ASan/UBSan
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Iinclude \
            tests/test_exact_factor_affine.cpp src/qfactor.cpp -o factor-affine-sanitize
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ./factor-affine-sanitize

  affine-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build benchmark
        run: |
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Iinclude benchmarks/factor_affine.cpp src/qfactor.cpp -o factor-affine-benchmark
      - name: Enforce architecture layers
        run: python tests/test_architecture_layers.py
      - name: Run matched controls
        run: |
          set -o pipefail
          ./factor-affine-benchmark | tee factor-affine-evidence.txt
      - name: Hash evidence
        run: sha256sum factor-affine-evidence.txt | tee factor-affine-evidence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-factor-affine-evidence
          path: |
            factor-affine-evidence.txt
            factor-affine-evidence.sha256
