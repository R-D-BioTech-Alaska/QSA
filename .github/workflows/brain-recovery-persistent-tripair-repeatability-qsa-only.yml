name: Brain Recovery Persistent Tripair Repeatability QSA Only

on:
  pull_request:
    paths:
      - "benchmarks/brain_recovery_persistent_tripair_repeatability_qsa_only.py"
      - "python/qsa/causal_persistent_workspace.py"
      - "python/qsa/causal_adjoint.py"
      - "include/qubit/qadjoint.hpp"
      - ".github/workflows/brain-recovery-persistent-tripair-repeatability-qsa-only.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-recovery-persistent-tripair-repeatability-qsa-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qsa-only-repeatability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - name: Check out exact branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact QSA source
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Compile QSA-only diagnostic
        run: |
          python -m py_compile benchmarks/brain_recovery_persistent_tripair_repeatability_qsa_only.py

      - name: Re-run inherited exact and persistent contracts
        run: |
          python tests/test_causal_adjoint_python.py
          python tests/test_persistent_adjoint_python.py

      - name: Run exact QSA-only repeatability matrix
        shell: bash
        run: |
          python benchmarks/brain_recovery_persistent_tripair_repeatability_qsa_only.py \
            --repeats 6 \
            --output brain-recovery-persistent-tripair-repeatability-qsa-only.json \
            2>&1 | tee brain-recovery-persistent-tripair-repeatability-qsa-only.txt

      - name: Summarize QSA-only repeatability evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("brain-recovery-persistent-tripair-repeatability-qsa-only.json")
              .read_text(encoding="utf-8")
          )
          print("contract=", receipt["contract"])
          for name in (
              "cached_selected_pullback",
              "cached_direct_adjoint",
              "fresh_adjoint_each_call",
              "fresh_runtime_each_call",
              "zero_cotangent_primed_selected_pullback",
          ):
              print(name, receipt[name])
          print("passed=", receipt["passed"])
          if not receipt["passed"]:
              raise SystemExit("QSA-only repeatability receipt failed")
          PY

      - name: Upload QSA-only repeatability evidence
        uses: actions/upload-artifact@v4
        with:
          name: brain-recovery-persistent-tripair-repeatability-qsa-only-${{ github.run_id }}
          path: |
            brain-recovery-persistent-tripair-repeatability-qsa-only.json
            brain-recovery-persistent-tripair-repeatability-qsa-only.txt
          if-no-files-found: error
          retention-days: 90
