name: QSA Causal Python Runtime

on:
  pull_request:
    paths:
      - "include/qubit/qcausal.hpp"
      - "include/qubit/qcausal_c_api.h"
      - "include/qubit/detail/qcausal_c_api_impl.hpp"
      - "include/qubit/version.h"
      - "python/qsa/causal.py"
      - "tests/test_causal_python.py"
      - ".github/workflows/qsa-causal-python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsa-causal-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  causal-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install causal QSA package
        run: python -m pip install --upgrade pip .
      - name: Run native causal Python contracts
        run: python tests/test_causal_python.py
