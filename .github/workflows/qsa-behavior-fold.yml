name: QSA Exact Behavior Fold

on:
  pull_request:
    paths:
      - "include/qubit/qbehavior.hpp"
      - "include/qubit/qbehavior_c_api.h"
      - "include/qubit/detail/qbehavior_c_api_impl.hpp"
      - "include/qubit/version.h"
      - "tests/test_behavior_fold.cpp"
      - ".github/workflows/qsa-behavior-fold.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  behavior-fold:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build behavior-fold test
        shell: bash
        run: |
          mkdir -p behavior-driver
          cat > behavior-driver/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(QSABehaviorFoldCheck LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          enable_testing()
          add_executable(behavior_fold_tests ../tests/test_behavior_fold.cpp)
          target_include_directories(behavior_fold_tests PRIVATE ../include)
          if(MSVC)
              target_compile_options(behavior_fold_tests PRIVATE /W4)
          else()
              target_compile_options(behavior_fold_tests PRIVATE -Wall -Wextra -Wpedantic -Wconversion -Wshadow)
          endif()
          add_test(NAME behavior_fold_tests COMMAND behavior_fold_tests)
          CMAKE
      - name: Configure
        run: cmake -S behavior-driver -B behavior-build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build behavior-build --config Release --parallel 2
      - name: Run
        run: ctest --test-dir behavior-build -C Release --output-on-failure

  behavior-fold-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run sanitizers
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Iinclude \
            tests/test_behavior_fold.cpp -o behavior-fold-sanitize
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ./behavior-fold-sanitize
