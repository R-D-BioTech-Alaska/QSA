name: QSA Structured Gaussian Bosonic

on:
  pull_request:
    paths:
      - "include/qubit/qgaussian.hpp"
      - "tests/test_structured_gaussian.cpp"
      - "benchmarks/structured_gaussian.cpp"
      - "tests/test_architecture_layers.py"
      - ".github/workflows/qsa-gaussian.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gaussian-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build structured Gaussian test
        shell: bash
        run: |
          mkdir -p gaussian-driver
          cat > gaussian-driver/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(QSAGaussianCheck LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          enable_testing()
          add_executable(gaussian_tests ../tests/test_structured_gaussian.cpp)
          target_include_directories(gaussian_tests PRIVATE ../include)
          if(MSVC)
              target_compile_options(gaussian_tests PRIVATE /W4)
          else()
              target_compile_options(gaussian_tests PRIVATE -Wall -Wextra -Wpedantic -Wconversion -Wshadow)
          endif()
          add_test(NAME gaussian_tests COMMAND gaussian_tests)
          CMAKE
      - name: Configure
        run: cmake -S gaussian-driver -B gaussian-build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build gaussian-build --config Release --parallel 2
      - name: Run
        run: ctest --test-dir gaussian-build -C Release --output-on-failure
      - name: Enforce architecture layers
        run: python tests/test_architecture_layers.py

  gaussian-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run ASan/UBSan
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Iinclude \
            tests/test_structured_gaussian.cpp -o gaussian-sanitize
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ./gaussian-sanitize

  gaussian-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build evidence carrier
        run: |
          c++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Iinclude benchmarks/structured_gaussian.cpp -o gaussian-benchmark
      - name: Run structured Gaussian carrier
        run: |
          set -o pipefail
          ./gaussian-benchmark | tee gaussian-evidence.txt
      - name: Enforce bounded evidence
        run: |
          python - <<'PY'
          values = {}
          with open("gaussian-evidence.txt", "r", encoding="utf-8") as handle:
              for line in handle:
                  key, sep, value = line.strip().partition("=")
                  if sep:
                      values[key] = value
          def number(name):
              return float(values[name])
          assert int(values["gaussian_modes"]) == 4096
          assert int(values["gaussian_components"]) == 3072
          assert int(values["gaussian_largest_component_modes"]) == 2
          assert int(values["gaussian_descriptor_scalars"]) == 32768
          assert int(values["gaussian_dense_descriptor_scalars"]) > 67000000
          assert number("gaussian_dense_to_structured_scalar_ratio") > 2000.0
          assert number("gaussian_total_mean_occupation") > 0.0
          assert number("gaussian_transform_ms") < 10000.0
          assert number("gaussian_query_ms") < 10000.0
          PY
      - name: Hash evidence
        run: sha256sum gaussian-evidence.txt | tee gaussian-evidence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-structured-gaussian-evidence
          path: |
            gaussian-evidence.txt
            gaussian-evidence.sha256
