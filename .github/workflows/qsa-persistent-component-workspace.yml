name: QSA Persistent Component Workspace

on:
  pull_request:
    paths:
      - "python/qsa/causal_persistent_workspace.py"
      - "tests/test_persistent_component_workspace_python.py"
      - "benchmarks/persistent_component_workspace.py"
      - ".github/workflows/qsa-persistent-component-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qsa-persistent-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistent-workspace-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QSA
        run: python -m pip install --upgrade pip .
      - name: Test persistent component workspace
        run: python tests/test_persistent_component_workspace_python.py

  persistent-workspace-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QSA
        run: python -m pip install --upgrade pip .
      - name: Benchmark persistent component workspace
        run: python benchmarks/persistent_component_workspace.py | tee persistent-workspace.txt
      - name: Seal benchmark receipt
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          line = Path("persistent-workspace.txt").read_text(encoding="utf-8").strip()
          fields = line.split()
          if not fields or fields[0] != "persistent_component_workspace":
              raise SystemExit("unexpected persistent workspace output")
          receipt = {"schema_version": "qsa.persistent-component-workspace.v1"}
          integer_fields = {
              "qubits",
              "local_qubits",
              "candidates",
              "steps",
              "operations",
              "parameters",
              "observables",
              "ephemeral_extractions",
              "persistent_extractions",
          }
          for field in fields[1:]:
              key, value = field.split("=", 1)
              receipt[key] = int(value) if key in integer_fields else float(value)
          receipt["passed"] = (
              receipt["qubits"] == 10_000
              and receipt["local_qubits"] == 3
              and receipt["candidates"] == 64
              and receipt["steps"] == 6
              and receipt["operations"] == 25
              and receipt["parameters"] == 18
              and receipt["observables"] == 14
              and receipt["ephemeral_extractions"] == 6
              and receipt["persistent_extractions"] == 1
              and receipt["max_error"] <= 2.0e-12
              and all(
                  math.isfinite(receipt[name]) and receipt[name] > 0.0
                  for name in ("ephemeral_ms", "persistent_ms", "speedup")
              )
          )
          if not receipt["passed"]:
              raise SystemExit(f"persistent workspace gate failed: {receipt}")
          Path("persistent-workspace.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-persistent-workspace-${{ github.run_id }}
          path: |
            persistent-workspace.txt
            persistent-workspace.json
          if-no-files-found: error
