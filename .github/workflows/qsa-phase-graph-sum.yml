name: QSA Exact Low-H Phase Graph Sum

on:
  pull_request:
    paths:
      - "include/qubit/qphase_graph.hpp"
      - "src/qphase_graph.cpp"
      - "include/qubit/qphase_sum.hpp"
      - "tests/test_phase_graph_sum.cpp"
      - "benchmarks/phase_graph_sum.cpp"
      - ".github/workflows/qsa-phase-graph-sum.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-sum-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build phase-sum driver
        shell: bash
        run: |
          mkdir -p phase-sum-driver
          cat > phase-sum-driver/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(QSAExactLowHPhaseGraphCheck LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(QSTATE_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(QSTATE_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(QSTATE_BUILD_BENCHMARKS OFF CACHE BOOL "" FORCE)
          set(QSTATE_BUILD_PYTHON_TESTS OFF CACHE BOOL "" FORCE)
          set(QSTATE_INSTALL_DEVELOPMENT OFF CACHE BOOL "" FORCE)
          add_subdirectory(.. qsa-core)
          enable_testing()
          add_executable(phase_graph_sum_tests ../tests/test_phase_graph_sum.cpp)
          target_link_libraries(phase_graph_sum_tests PRIVATE qstate_core)
          if(MSVC)
              target_compile_options(phase_graph_sum_tests PRIVATE /W4)
          else()
              target_compile_options(phase_graph_sum_tests PRIVATE -Wall -Wextra -Wpedantic -Wconversion -Wshadow)
          endif()
          add_test(NAME phase_graph_sum_tests COMMAND phase_graph_sum_tests)
          CMAKE
      - name: Configure
        run: cmake -S phase-sum-driver -B phase-sum-build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build phase-sum-build --config Release --target phase_graph_sum_tests --parallel 2
      - name: Run
        run: ctest --test-dir phase-sum-build -C Release --output-on-failure

  phase-sum-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build sanitizer driver
        run: |
          mkdir -p phase-sum-driver
          cat > phase-sum-driver/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(QSAExactLowHPhaseGraphSanitize LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(QSTATE_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(QSTATE_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(QSTATE_BUILD_BENCHMARKS OFF CACHE BOOL "" FORCE)
          set(QSTATE_BUILD_PYTHON_TESTS OFF CACHE BOOL "" FORCE)
          set(QSTATE_INSTALL_DEVELOPMENT OFF CACHE BOOL "" FORCE)
          add_compile_options(-fsanitize=address,undefined -fno-omit-frame-pointer)
          add_link_options(-fsanitize=address,undefined -fno-omit-frame-pointer)
          add_subdirectory(.. qsa-core)
          add_executable(phase_graph_sum_tests ../tests/test_phase_graph_sum.cpp)
          target_link_libraries(phase_graph_sum_tests PRIVATE qstate_core)
          CMAKE
          cmake -S phase-sum-driver -B phase-sum-sanitize-build -DCMAKE_BUILD_TYPE=Debug
          cmake --build phase-sum-sanitize-build --target phase_graph_sum_tests --parallel 2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ./phase-sum-sanitize-build/phase_graph_sum_tests

  phase-sum-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build evidence carrier
        run: |
          mkdir -p phase-sum-driver
          cat > phase-sum-driver/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(QSAExactLowHPhaseGraphEvidence LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(QSTATE_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(QSTATE_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(QSTATE_BUILD_BENCHMARKS OFF CACHE BOOL "" FORCE)
          set(QSTATE_BUILD_PYTHON_TESTS OFF CACHE BOOL "" FORCE)
          set(QSTATE_INSTALL_DEVELOPMENT OFF CACHE BOOL "" FORCE)
          add_subdirectory(.. qsa-core)
          add_executable(phase_graph_sum_benchmark ../benchmarks/phase_graph_sum.cpp)
          target_link_libraries(phase_graph_sum_benchmark PRIVATE qstate_core)
          CMAKE
          cmake -S phase-sum-driver -B phase-sum-evidence-build -DCMAKE_BUILD_TYPE=Release
          cmake --build phase-sum-evidence-build --target phase_graph_sum_benchmark --parallel 2
      - name: Run phase-sum carrier
        run: |
          set -o pipefail
          ./phase-sum-evidence-build/phase_graph_sum_benchmark | tee phase-graph-sum-evidence.txt
      - name: Enforce bounded evidence
        run: |
          python - <<'PY'
          import math
          values = {}
          with open("phase-graph-sum-evidence.txt", "r", encoding="utf-8") as handle:
              for line in handle:
                  key, sep, value = line.strip().partition("=")
                  if sep:
                      values[key] = value
          assert int(values["carrier_qubits"]) == 4096
          assert int(values["carrier_phase_edges_per_branch"]) == 16384
          assert int(values["carrier_hadamard_defects"]) == 8
          assert int(values["carrier_branches"]) == 256
          assert int(values["carrier_total_phase_edges"]) == 4194304
          assert 0 < int(values["carrier_retained_estimated_bytes"]) <= 512 * 1024 * 1024
          assert float(values["carrier_dense_to_retained_ratio_log2"]) > 4070.0
          assert abs(float(values["carrier_scaled_mantissa_norm2"]) - 256.0) < 1e-9
          assert abs(float(values["carrier_log2_amplitude_scale"]) + 2048.0) < 1e-12
          assert abs(float(values["carrier_log2_probability_zero"]) + 4088.0) < 1e-9
          assert float(values["carrier_graph_build_ms"]) > 0.0
          assert float(values["carrier_branch_build_ms"]) > 0.0
          assert float(values["carrier_scaled_query_ms"]) > 0.0
          assert int(values["carrier_direct_amplitude_underflow_rejected"]) == 1
          assert int(values["carrier_ninth_h_rejected"]) == 1
          assert int(values["carrier_branch_count_after_rejection"]) == 256
          assert int(values["carrier_dense_state_materialized"]) == 0
          PY
      - name: Hash evidence
        run: sha256sum phase-graph-sum-evidence.txt | tee phase-graph-sum-evidence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-phase-graph-sum-evidence
          path: |
            phase-graph-sum-evidence.txt
            phase-graph-sum-evidence.sha256
