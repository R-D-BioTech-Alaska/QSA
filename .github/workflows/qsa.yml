name: QSA Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qsa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-version-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/release-0.1.7-version-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-0.1.7-version-sync
          fetch-depth: 0
      - name: Synchronize 0.1.7 metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = -1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old!r}")
              target.write_text(text.replace(old, new, count), encoding="utf-8")

          Path("VERSION").write_text("0.1.7\n", encoding="utf-8")
          replace("pyproject.toml", 'version = "0.1.6"', 'version = "0.1.7"', 1)
          replace(
              "CMakeLists.txt",
              "project(QubitNativeStateEngine VERSION 0.1.6 LANGUAGES CXX)",
              "project(QubitNativeStateEngine VERSION 0.1.7 LANGUAGES CXX)",
              1,
          )
          replace(
              "include/qubit/version.h",
              "#define QSTATE_VERSION_PATCH 6",
              "#define QSTATE_VERSION_PATCH 7",
              1,
          )
          replace(
              "include/qubit/version.h",
              '#define QSTATE_VERSION_STRING "0.1.6"',
              '#define QSTATE_VERSION_STRING "0.1.7"',
              1,
          )
          replace(
              "python/qsa/__init__.py",
              '__version__ = "0.1.6"',
              '__version__ = "0.1.7"',
              1,
          )
          replace("CITATION.cff", 'version: "0.1.6"', 'version: "0.1.7"', 1)
          replace(
              "CITATION.cff",
              'date-released: "2026-07-24"',
              'date-released: "2026-07-28"',
              1,
          )
          replace("tests/test_python_compat.py", '"0.1.6"', '"0.1.7"')
          replace("tests/test_c_api.cpp", '"0.1.6"', '"0.1.7"', 1)
          replace(
              ".github/ISSUE_TEMPLATE/bug_report.yml",
              "placeholder: 0.1.6",
              "placeholder: 0.1.7",
              1,
          )
          replace(
              "docs/VALIDATION.md",
              "> Historical report for QSA 0.1.2. The current QSA 0.1.6 release report is in [`VALIDATION_0_1_6.md`](VALIDATION_0_1_6.md).",
              "> Historical report for QSA 0.1.2. The QSA 0.1.6 release report is in [`VALIDATION_0_1_6.md`](VALIDATION_0_1_6.md).",
              1,
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          if "## 0.1.7 — 2026-07-28" not in text:
              section = """## 0.1.7 — 2026-07-28

- Added native quantum-dot pockets and exact reference validation
- Added exact structural CNOT, CZ, and disconnected SWAP acceleration
- Added joint component measurement and component-aware symmetry discovery
- Added Bayesian adaptive compaction with mandatory exact audits
- Added exact representation advice for register, symmetry, stabilizer, phase-graph, and quantum-dot workloads
- Added exact stabilizer and uniform phase-graph backends
- Added dependency-aware operation reduction and parallel independent-component execution
- Added zero-copy component read views and reusable output buffers
- Added compiled exact diagonal plans
- Added structured diagonal execution and linear sparse X/Y permutations
- Added word-parallel stabilizer batch execution with bounded scratch memory
- Preserved the QSA 0.1 C++, C, Python, and QSC v1 compatibility contracts

"""
              changelog.write_text(
                  text.replace("# Changelog\n\n", "# Changelog\n\n" + section, 1),
                  encoding="utf-8",
              )
          PY
          python tests/test_version_sync.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/qsa.yml
          rm -f .github/workflows/release-0.1.7-sync.yml
          git config user.name "Inserian"
          git config user.email "99493283+Inserian@users.noreply.github.com"
          git add VERSION pyproject.toml CMakeLists.txt include/qubit/version.h \
            python/qsa/__init__.py CITATION.cff tests/test_python_compat.py \
            tests/test_c_api.cpp .github/ISSUE_TEMPLATE/bug_report.yml \
            docs/VALIDATION.md CHANGELOG.md .github/workflows/qsa.yml \
            .github/workflows/release-0.1.7-sync.yml
          git commit -m "Release QSA 0.1.7"
          git push origin HEAD:agent/release-0.1.7-version-sync

  cpp-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CTest validation dependency
        run: python -m pip install --upgrade pip numpy
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DQSTATE_BUILD_EXAMPLES=OFF
          -DQSTATE_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install CMake package
        if: matrix.os == 'ubuntu-latest'
        run: cmake --install build --config Release --prefix install
      - name: Build independent C and C++ consumers
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -S tests/consumer -B consumer-build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
          cmake --build consumer-build --parallel
          ./consumer-build/qsa_consumer_cpp
          LD_LIBRARY_PATH="${{ github.workspace }}/install/qsa:${LD_LIBRARY_PATH:-}" ./consumer-build/qsa_consumer_c

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: >-
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
          -DQSTATE_BUILD_EXAMPLES=OFF
          -DQSTATE_BUILD_BENCHMARKS=OFF
          -DQSTATE_BUILD_PYTHON_TESTS=OFF
          -DQSTATE_ENABLE_IPO=OFF
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure

  differential-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --upgrade pip numpy
      - name: Build native library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQSTATE_BUILD_TESTS=OFF -DQSTATE_BUILD_EXAMPLES=OFF -DQSTATE_BUILD_BENCHMARKS=OFF
          cmake --build build --parallel
      - name: Random-circuit differential tests
        env:
          QSA_NATIVE_LIB: ${{ github.workspace }}/build/libqstate.so
          PYTHONPATH: python
        run: |
          python tests/differential_numpy.py
          python tests/differential_grover.py
          python tests/differential_symmetry.py

  python-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install QSA package
        run: python -m pip install --upgrade pip .
      - name: Import and compatibility test
        run: >-
          python -c "from qsa import QubitRegister, SymmetryState;
          from qubit_native import QubitRegister as Legacy, SymmetryState as LegacySymmetry;
          assert Legacy is QubitRegister and LegacySymmetry is SymmetryState;
          s=QubitRegister(2); s.apply_batch([('h',0),('cnot',0,1)]);
          assert abs(abs(s.amplitude(0))-2**-0.5)<1e-12;
          assert s.qubit_count==2 and s.qubit_count()==2;
          p=s.encode_qsc(); s.close(); r=QubitRegister.decode_qsc(p);
          assert abs(abs(r.amplitude(3))-2**-0.5)<1e-12; r.close();
          y=SymmetryState.hamming_weight(8); assert y.class_count==9; y.close()"

  package-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel and smoke test
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from qsa import QubitRegister, GroverSearch, SymmetryState; q=QubitRegister(2); q.h(0).cnot(0,1); assert q.validate(); q.close(); g=GroverSearch(12,[7]); g.run_optimal(); assert g.success_probability>0.99; g.close(); s=SymmetryState.hamming_weight(32); assert s.class_count==33; s.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: qsa-python-distributions
          path: dist/*
